version: "3.9"

networks:
  app-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local

services:

  mongodb:
    image: mongo:7.0
    container_name: muchtodo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: muchtodo
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 8080
      MONGO_URI: mongodb://admin:secret123@mongodb:27017/muchtodo?authSource=admin
      DB_NAME: muchtodo
      JWT_SECRET_KEY: changeme-in-production
      JWT_EXPIRATION_HOURS: 72
      ENABLE_CACHE: "false"
      LOG_LEVEL: info
      LOG_FORMAT: text
    ports:
      - "8080:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s